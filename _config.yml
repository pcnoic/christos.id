title: Chris Alexiou
author: Chris Alexiou
email: c@christos.id
url: https://christos.id
baseurl: ""
description: >
  Ops person. Software janitor.

permalink: /:slug.html

favicon: "logo.png"

theme_config:
  appearance: "auto"
  back_home_text: ".."
  date_format: "%Y-%m-%d"
  show_description: false
  lowercase_titles: true

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO Configuration
twitter:
  username: pcnoic
  card: summary

social:
  name: Chris Alexiou
  links:
    - https://twitter.com/pcnoic
    - https://github.com/pcnoic
    - https://linkedin.com/in/christos-alexiou

# Structured Data defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Chris Alexiou"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Collections for programmatic SEO
collections:
  programmatic_pages:
    output: true
    permalink: /:collection/:title/
  topics:
    output: true
    permalink: /topics/:slug/

# IndexNow Configuration
indexnow:
  enabled: true
  key: "christos-id-indexnow-key"

exclude:
  - src/pages
  - seo.md
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - Rakefile
  - README.md
