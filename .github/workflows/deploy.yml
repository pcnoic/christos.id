name: Deploy Blog

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      - '_layouts/**'
      - '_includes/**'
      - '_data/**'
      - '_plugins/**'
      - 'assets/**'
      - '*.html'
      - '*.md'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'Dockerfile'
      - 'k8s/**'
  workflow_dispatch:

env:
  REGISTRY: registry.christos.id
  PROJECT: blog

jobs:
  # -- Build image and push to Harbor -------------------------------------------
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push blog image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/blog:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/blog:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.PROJECT }}/blog:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.PROJECT }}/blog:buildcache,mode=max
          provenance: false

      - name: Export image reference
        id: set-image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.PROJECT }}/blog:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # -- Deploy to Kubernetes -----------------------------------------------------
  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy blog
        working-directory: k8s/overlays/production
        run: |
          kustomize edit set image "blog=${{ needs.build-push.outputs.image }}"
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/blog \
            -n blog \
            --timeout=300s

      - name: Verify pod health
        run: |
          kubectl get pods -n blog
          kubectl rollout history deployment/blog -n blog
