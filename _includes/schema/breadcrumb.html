{% comment %}
Breadcrumb Schema Markup
Usage: {% include schema/breadcrumb.html %}
Automatically generates breadcrumbs based on page URL structure
{% endcomment %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}"
    }
    {% if page.url != "/" %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title | default: page.url | replace: '/', ' ' | strip }}",
      "item": "{{ page.url | absolute_url }}"
    }
    {% endif %}
  ]
}
</script>
